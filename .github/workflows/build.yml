name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true

      - name: Rubocop
        run: bin/rubocop

      - name: Clean Types
        run: pnpm clean

      - name: Run Migrations
        run: pnpm migrate

      - name: Generate Types
        run: pnpm gen

      - name: Type Check
        run: pnpm tsc

      - name: ESLint
        run: pnpm lint

      - name: JavaScript Tests
        run: pnpm test run

      - name: Build Playground
        run: pnpm --filter sample_app exec vite build

  test:
    name: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ endsWith(matrix.ruby, 'head') || matrix.ruby == 'debug' || matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: [
          "3.3",
          "4.0.7",
        ]
        gemfile: [
          "Gemfile-rails.7.2.x",
          "Gemfile-rails.8.0.x",
          "Gemfile-rails.8.1.x",
        ]
        experimental: [false]
        include:
          - ruby: "4.0.7"
            os: ubuntu-latest
            gemfile: Gemfile-rails-edge
            experimental: true
    env:
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run Migrations
        run: cd playground/vanilla && bin/rails db:prepare

      - name: Ruby Specs
        run: bin/rspec

      - name: Upload code coverage to qlty
        if: ${{ contains(github.ref, 'main') }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/.resultset.json
          format: simplecov
